[package]
# Published as `targrep` (the project's name); the library and binary are
# still `trg`, so `cargo install targrep` puts `trg` on the PATH.
name = "targrep"
version = "0.5.0"
edition = "2024"
license = "MIT"
authors = ["Thomas Björk"]
description = "Search inside compressed log archives (.tgz, .tar.zst, .tar.xz) with ripgrep's flags and per-member line numbers"
repository = "https://github.com/codedeviate/trg"
homepage = "https://github.com/codedeviate/trg"
readme = "README.md"
keywords = ["grep", "tar", "archive", "logs", "search"]
categories = ["command-line-utilities", "text-processing", "compression"]
exclude = ["bench/", "scripts/"]

[lib]
name = "trg"
path = "src/lib.rs"

[[bin]]
name = "trg"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
flate2 = "1.1.9"
globset = "0.4.20"
grep-matcher = "0.1.9"
grep-printer = "0.3.1"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
lexopt = "0.3.2"
libc = "0.2.189"
libdeflater = "1.26.0"
liblzma = { version = "0.4.9", default-features = false, features = ["static"] }
num_cpus = "1.17.0"
tar = "0.4.46"
termcolor = "1.4.1"
zstd = "0.13.3"

[dev-dependencies]
assert_cmd = "2.2.2"
libc = "0.2.189"
liblzma = { version = "0.4.9", default-features = false, features = ["static"] }
tar = "0.4.46"
tempfile = "3.27.0"
zstd = "0.13.3"

[features]
# zlib-ng by default: measured on Linux/aarch64 over the 11.5 GB benchmark
# corpus, `trg -j1` costs 3.85 s user CPU on zlib-ng against 6.60 s on flate2's
# default miniz_oxide backend — 1.71x, with byte-identical output and the whole
# suite green on both. Task 1's gate said 0.96x, but it ran on macOS, which is
# neither the production platform nor the one every spec figure was measured on.
#
# The cost is a build-time dependency on cmake and a C toolchain (libz-ng-sys
# builds zlib-ng from source). Where that is not available:
#     cargo build --release --no-default-features
# which falls back to miniz_oxide — pure Rust, still 2.9x cheaper than the
# `gzip` binary that zgrep and `rg -z` both shell out to.
default = ["zlib-ng"]
zlib-ng = ["flate2/zlib-ng"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
